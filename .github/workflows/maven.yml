name: Maven verification

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Keycloak ${{ matrix.keycloak-version }} / Java 21
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        keycloak-version: ['26.7.4', '26.8.2']
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run tests
        run: mvn -B --no-transfer-progress -Dkeycloak.version=${{ matrix.keycloak-version }} clean verify
      - name: Prepare SHA256 checksum and build metadata
        shell: bash
        run: |
          sha256sum target/keycloak-client-role-webhook-1.2.0-SNAPSHOT.jar > target/SHA256SUMS.txt
          printf 'Commit: %s\nBranch: %s\nKeycloak: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "${{ matrix.keycloak-version }}" > target/BUILD-INFO.txt
      - name: Publish compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-client-webhook-${{ matrix.keycloak-version }}
          path: |
            target/keycloak-client-role-webhook-1.2.0-SNAPSHOT.jar
            target/SHA256SUMS.txt
            target/BUILD-INFO.txt
          retention-days: 30
          if-no-files-found: error
